<style>
:root{font:16px/1.55 system-ui,sans-serif;color:#093952;background:#eef6fa}
*{box-sizing:border-box}
body{margin:0}
header{background:white;border-top:6px solid #f6b642;text-align:center;padding:22px;font-size:24px;font-weight:800}
main{max-width:870px;margin:auto;padding:24px}
main.staff{max-width:1400px}
h1{font-size:clamp(26px,5vw,42px);margin:.2em 0 .6em;text-align:center}
section,fieldset{background:white;border:1px solid #cfe2ed;border-radius:15px;padding:18px;margin:16px 0}
legend{font-size:clamp(17px,2.4vw,21px);font-weight:750;padding:0 9px;max-width:100%}
.grid{display:grid;gap:16px}
.form-row{display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr));align-items:end;gap:14px}
fieldset,.question,label{min-width:0}
label,.question,legend{overflow-wrap:anywhere}
label{align-content:start}
textarea{resize:vertical}
.form-row .question>input:not([type=checkbox]),
.form-row .question>select,
.form-row .question>textarea{height:42px;min-height:42px}
.form-row:has(.question>textarea) .question>input:not([type=checkbox]),
.form-row:has(.question>textarea) .question>select,
.form-row:has(.question>textarea) .question>textarea{height:64px;min-height:64px}
.form-row:has(.question>textarea) .question>textarea{resize:vertical}
.file-picker{position:relative;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border:1px solid #bed8e7;border-radius:8px;background:#f8fcff;cursor:pointer;text-align:center}
.file-picker input[type=file]{position:absolute;inset:0;width:100%;height:100%;padding:0;opacity:0;cursor:pointer}
.file-picker:focus-within{outline:2px solid #0879a4;outline-offset:2px}
.file-picker-button{padding:2px 10px;border:1px solid #bed8e7;border-radius:5px;background:#fff}
.file-picker-name{min-width:0;overflow-wrap:anywhere}
input[type=file]{max-width:100%}
.required{color:#bd2031}
.submit-row,.certification{text-align:center}
.certification label.choice{justify-content:center;align-items:flex-start;max-width:660px;margin:8px auto 0}
.certification span{line-height:1.55}
.certification input{flex:none;margin-top:5px}
.work-group+.work-group{padding-top:14px;border-top:1px solid #dae9f1}
.work-group h3{margin:0 0 12px;font-size:16px}
.instructions p{margin:.45em 0 .85em}
@media(max-width:670px){.form-row{grid-template-columns:repeat(min(var(--columns),2),minmax(0,1fr))}}
@media(max-width:450px){.form-row{grid-template-columns:1fr}}
label{display:grid;gap:5px;font-size:14px;font-weight:650}
label.choice{display:flex;align-items:center;font-weight:400}
input,textarea,select,button{font:inherit;border-radius:8px;border:1px solid #bed8e7;padding:9px;min-width:0}
input,textarea,select{width:100%;background:#f8fcff;color:inherit}
input[type=checkbox]{width:auto}
button{cursor:pointer;color:white;background:#0879a4;border-color:#0879a4;font-weight:700}
button:disabled{opacity:.55;cursor:default}
a{color:#075477}
table{width:100%;border-collapse:collapse}
th,td{padding:11px;text-align:left;border-bottom:1px solid #dae9f1;vertical-align:top}
th{background:#eef6fa}
.scroll{overflow:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.message{overflow-wrap:anywhere;white-space:pre-wrap;background:#eef6fa;padding:10px;border-radius:7px}
#notice{color:#8c2a25}
small{font-weight:400}
[hidden]{display:none!important}
</style>

<script>
const onlineParams=new URLSearchParams(location.search);
const init={view:onlineParams.get('online')==='onsite'?'onsite':'applicant',token:onlineParams.get('case')||'',site:onlineParams.get('site')||''};
const root=document.getElementById('screen'), notice=document.getElementById('notice');
let token=init.token, fields=[], running=false, confirmedTicket=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(action,data={})=>onlineRequest(action,{token,site:init.site,...data});
const star='<span class="required" aria-label="required">*</span>';
const marked=(value,required)=>esc(value)+(required?' '+star:'');
const form=(action,contents,label)=>'<form data-action="'+action+'">'+contents+'<p'+(action==='submit'?' class="submit-row"':'')+'><button'+(action==='submit'?' disabled':'')+'>'+label+'</button></p></form>';
const field=(name,label,type='text',attrs='')=>'<label><span>'+esc(label.replace(/ \*$/,''))+(label.endsWith(' *')?' '+star:'')+'</span><input name="'+name+'" type="'+type+'" '+attrs+'></label>';
const docs='<label><span>Upload Pre-Requirements Documents (PDF or JPEG) '+star+'</span><span class="file-picker"><input name="docs" type="file" accept=".pdf,.jpg,.jpeg,application/pdf,image/jpeg" multiple required><span class="file-picker-button" aria-hidden="true">Choose Files</span><span class="file-picker-name" aria-live="polite">No file chosen</span></span><small>Up to 5 MB per file and 10 MB per upload.</small></label>';
const filesToData=async files=>{
  if(files.length>5||files.some(f=>f.size>5*1024*1024)||files.reduce((n,f)=>n+f.size,0)>10*1024*1024)throw Error('Choose up to five files, no more than 5 MB each and 10 MB total.');
  return Promise.all(files.map(file=>new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({name:file.name,data:reader.result.split(',')[1]});
    reader.onerror=()=>reject(Error('File could not be read.'));
    reader.readAsDataURL(file);
  })));
};
function question(q){
  const title=marked(q.title,q.required), name='q'+q.id, required=q.required?' required':'';
  const help=q.help?'<small>'+esc(q.help)+'</small>':'';
  if(q.type==='CHECKBOX'){
    const certification=q.title==='Certification';
    const text=value=>esc(value).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    return '<div class="question'+(certification?' certification':'')+'" data-id="'+q.id+'"><strong>'+title+'</strong>'+help+q.choices.map(c=>'<label class="choice"><input type="checkbox" name="'+name+'" value="'+esc(c)+'"'+(q.required&&q.choices.length===1?' required':'')+'><span>'+text(c)+'</span></label>').join('')+(q.other?field(name,'Other'):'')+'</div>';
  }
  let control;
  if(q.choices.length)control='<select name="'+name+'"'+required+'><option value="">Select an option</option>'+q.choices.map(c=>'<option>'+esc(c)+'</option>').join('')+(q.other?'<option value="__other">Other</option>':'')+'</select>'+(q.other?'<input name="'+name+'Other" placeholder="Specify other" hidden>':'');
  else if(q.title==='Email / Gmail Address'||q.title==='Mobile Number'){
    control='<input name="'+name+'" type="'+(q.title==='Mobile Number'?'tel':'email')+'"'+required+'>';
  }
  else if(q.type==='PARAGRAPH_TEXT')control='<textarea name="'+name+'" maxlength="1500"'+required+'></textarea>';
  else control='<input name="'+name+'" type="'+({DATE:'date',DATETIME:'datetime-local',TIME:'time'}[q.type]||'text')+'" maxlength="1500"'+required+'>';
  return '<label class="question" data-id="'+q.id+'"><span>'+title+'</span>'+help+control+'</label>';
}
const instructions='<section class="instructions" aria-label="Application instructions">'+
  '<strong>ENGLISH</strong><p>Please complete all applicable information accurately and truthfully. <strong>Fields marked with an asterisk ('+star+') are required.</strong></p>'+
  '<p>After submitting, save your private application link and check the conversation for updates. Present your queue number to the recruiter when visiting the office.</p>'+
  '<strong>TAGALOG</strong><p>Pakisagutan nang tama at kumpleto ang lahat ng kinakailangang impormasyon. <strong>Ang mga tanong na may asterisk ('+star+') ay kailangang sagutan.</strong></p>'+
  '<p>Pagkatapos isumite ang form, i-save ang iyong private application link at tingnan ang conversation para sa updates. Ipakita ang queue number sa recruiter sa pagpunta sa opisina.</p></section>';
const row=items=>'<div class="form-row" style="--columns:'+items.length+'">'+items.map(question).join('')+'</div>';
const rows=(items,sizes)=>{
  let offset=0;
  return sizes.map(size=>{const part=items.slice(offset,offset+size);offset+=size;return part.length?row(part):'';}).join('')+
    (offset<items.length?items.slice(offset).map(item=>row([item])).join(''):'');
};
function sectionLayout(group){
  const items=group.items;
  switch(group.title[0]){
    case 'A':return rows(items,[3,3,3,4]);
    case 'B':return rows(items,[3,2,2,2,2]);
    case 'C':return rows(items,[2,2]);
    case 'D':return rows(items,[3,3,3,3,1]);
    case 'E':return rows(items,[3,3,3]);
    case 'F':return rows(items,[2,2,2,2,2,2,1,2,2,1]);
    case 'G': {
      const groups=new Map();
      for(const item of items){
        const key=item.title.match(/^Work (\d+)/)?.[1]||'';
        if(!groups.has(key))groups.set(key,[]);
        groups.get(key).push(item);
      }
      return Array.from(groups,([number,fields])=>number?
        '<div class="work-group grid"><h3>Work '+number+'</h3>'+rows(fields,[3,3,1])+'</div>':rows(fields,[1])).join('');
    }
    default:return rows(items,[]);
  }
}
function syncApplication(form){
  if(form?.dataset.action!=='submit')return;
  const same=fields.find(q=>q.title.startsWith('Is your permanent address'));
  const showPermanent=/^no\b/i.test(form.elements['q'+same?.id]?.value||'');
  for(const item of fields.filter(q=>q.title.startsWith('Permanent '))){
    const wrapper=form.querySelector('[data-id="'+item.id+'"]');
    wrapper.hidden=!showPermanent;
    for(const control of wrapper.querySelectorAll('input,select,textarea')){
      control.disabled=!showPermanent;
      control.required=showPermanent&&item.required;
    }
  }
  form.querySelectorAll('.form-row').forEach(row=>{row.hidden=Array.from(row.children).every(child=>child.hidden);});
  const requiredFilled=Array.from(form.elements).every(n=>!n.required||n.disabled||
    (n.type==='checkbox'?n.checked:n.type==='file'?n.files.length>0:Boolean(n.value.trim())));
  const requiredChoices=fields.filter(q=>q.required&&q.type==='CHECKBOX').every(q=>
    Array.from(form.querySelectorAll('[name="q'+q.id+'"]:checked')).length>0);
  form.querySelector('button[type="submit"], .submit-row button').disabled=!(requiredFilled&&requiredChoices&&form.checkValidity());
}
function intake(){
  fields=JSON.parse(document.getElementById('recruitment-fields').textContent);
  const groups=[];
  for(const q of fields) {
    if(!q.id)groups.push({title:q.title,items:[]});
    else groups.at(-1).items.push(q);
  }
  const blocks=groups.filter(g=>g.items.length).map(g=>'<fieldset><legend>'+esc(g.title)+'</legend><div class="grid">'+sectionLayout(g)+'</div></fieldset>').join('');
  root.innerHTML=form('submit','<fieldset><legend>Recruitment Transaction '+star+'</legend><div class="grid"><label><span>Select your transaction</span><select name="transaction" required><option value="">Select recruitment transaction</option><option value="NH">New Hire</option><option value="RH">Rehire</option></select></label>'+field('email','Email *','email','maxlength="254" required')+'</div></fieldset>'+instructions+blocks+'<fieldset><legend>Pre-Requirements</legend>'+docs+'</fieldset>','Submit');
  syncApplication(root.querySelector('form'));
}
async function conversation(){
  const state=await api('read');
  const draft=onlineChat.draft(root);
  const controls=
    '<p>Save <a href="'+esc(new URL('online.html?case='+token,location.href).href)+'">your private application link</a> to return to the chat.</p>';
  let process='';
  if(state.stage==='Ready to book')process=form('book',field('appointment','Choose your arrival date and time (PHT) *','datetime-local','required'),'Get Queue');
  if(state.stage==='Review')process=form('upload',docs,'Upload additional documents');
  if(state.stage==='Booked')process+='<p>On your appointment date, scan the QR displayed at the office to join the active queue.</p>';
  root.innerHTML='<section>'+controls+'<h2>'+esc(state.name)+'</h2><p>'+esc(state.stage)+(state.number?' · <strong>'+esc(state.number)+'</strong>':'')+(state.appointment?' · '+esc(state.appointment.replace('T',' ')+' PHT'):'')+'</p>' + '<p>Uploaded files</p><ul>'+state.files.map(f=>'<li>'+esc(f.name)+'</li>').join('')+'</ul>'+process+'</section>'+onlineChat.markup(state.messages,'Applicant','chat',draft);
  onlineChat.scroll(root);
}
function queueConfirmation(ticket){
  const privateLink=new URL('online.html?case='+token,location.href).href;
  const date=ticket.appointment?new Date(ticket.appointment+':00+08:00'):null;
  const appointment=date&&Number.isFinite(date.getTime())?new Intl.DateTimeFormat('en-PH',{dateStyle:'long',timeStyle:'short',timeZone:'Asia/Manila'}).format(date)+' PHT':ticket.appointment||'';
  root.innerHTML='<section class="queue-confirmation" aria-labelledby="queue-ready-heading"><span class="queue-badge">Queue number confirmed</span>'+
    '<h2 id="queue-ready-heading" tabindex="-1">Your queue number is ready</h2><strong class="queue-code">'+esc(ticket.number)+'</strong>'+
    (appointment?'<p><strong>Appointment:</strong> '+esc(appointment)+'</p>':'')+
    '<p>Save your queue number and <a href="'+esc(privateLink)+'">private application link</a>. Scan the office QR on your appointment date to join the active queue.</p>'+
    '<div class="queue-actions"><a class="queue-action" href="online.html">Register Another Applicant</a><button type="button" data-queue-done>Done</button></div></section>';
  root.querySelector('#queue-ready-heading').focus();
}
async function render(){
  if(init.view==='onsite'){
    root.innerHTML=form('arrive',field('link','Paste your private application link','url','required'),'Confirm onsite arrival');
    return;
  }
  if(confirmedTicket)return queueConfirmation(confirmedTicket);
  if(token)return conversation();
  return intake();
}
async function run(task){
  if(running)return;
  running=true;root.inert=true;notice.textContent='Working…';
  try{await task();notice.textContent='';document.getElementById('backup').hidden=true;}
  catch(e){
    notice.textContent=e.message||String(e);
    if(!bridgeWindow||/timed out/i.test(notice.textContent)){
      const fallback=new URL(window.TIPON_CONFIG.onlineBackendUrl);
      fallback.searchParams.set('online',init.view);
      if(token)fallback.searchParams.set('case',token);
      if(init.site)fallback.searchParams.set('site',init.site);
      document.getElementById('backupLink').href=fallback.href;
      document.getElementById('backup').hidden=false;
    }
  }
  finally{running=false;root.inert=false;}
}
root.addEventListener('input',e=>syncApplication(e.target.form));
root.addEventListener('change',e=>{
  const node=e.target;
  if(node.type==='file'){
    const filename=node.closest('.file-picker')?.querySelector('.file-picker-name');
    if(filename)filename.textContent=node.files.length?Array.from(node.files,file=>file.name).join(', '):'No file chosen';
  }
  const other=node.name?.startsWith('q')&&node.form?.elements[node.name+'Other'];
  if(other){other.hidden=node.value!=='__other';other.required=!other.hidden;}
  syncApplication(node.form);
});
root.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.dataset.action==='submit'){
    syncApplication(e.target);
    if(e.target.querySelector('.submit-row button').disabled)return;
  }
  run(async()=>{
    const data=new FormData(e.target), action=e.target.dataset.action;
    if(action==='submit'){
      const requestToken=sessionStorage.getItem('tiponOnlineDraft')||Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');
      sessionStorage.setItem('tiponOnlineDraft',requestToken);
      const answers=Object.fromEntries(fields.filter(q=>q.id).map(q=>{
        const key='q'+q.id, value=data.get(key);
        return [q.id,q.type==='CHECKBOX'?data.getAll(key):value==='__other'?data.get(key+'Other'):value];
      }));
      await api('submit',{token:requestToken,transaction:data.get('transaction'),email:data.get('email'),answers,files:await filesToData(data.getAll('docs'))});
      token=requestToken;
      sessionStorage.removeItem('tiponOnlineDraft');
    }else if(action==='upload')await api('upload',{files:await filesToData(data.getAll('docs'))});
    else if(action==='arrive'){
      token=new URL(data.get('link')).searchParams.get('case')||'';
      const result=await api('arrive');root.innerHTML='<section><h2>Checked in</h2><p>Your queue number is <strong>'+esc(result.number)+'</strong>.</p></section>';return;
    }else if(action==='book'){
      const appointment=String(data.get('appointment')||'');
      const result=await api('book',{appointment});
      if(!result?.number)throw Error('The queue number could not be confirmed. Please check your application and try again.');
      confirmedTicket={number:result.number,appointment};
      queueConfirmation(confirmedTicket);
      return;
    }else{
      await api(action,Object.fromEntries(data));
      if(action==='chat')e.target.reset();
    }
    await render();
  });
});
root.addEventListener('click',e=>{
  if(e.target.closest('button[data-queue-done]')){confirmedTicket=null;run(render);}
  else if(e.target.closest('button[data-refresh]'))run(render);
});
if(init.view==='onsite')document.getElementById('heading').textContent='Office check-in';
run(render);
</script>
</body>
