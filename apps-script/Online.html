<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><base target="_top">
<title>TIPON TAWAG · Online Queue</title>
<style>
:root{font:16px/1.55 system-ui,sans-serif;color:#093952;background:#eef6fa}
*{box-sizing:border-box}
body{margin:0}
header{background:white;border-top:6px solid #f6b642;text-align:center;padding:22px;font-size:24px;font-weight:800}
main{max-width:870px;margin:auto;padding:24px}
main.staff{max-width:1400px}
h1{font-size:clamp(26px,5vw,42px);margin:.2em 0 .6em}
section,fieldset{background:white;border:1px solid #cfe2ed;border-radius:15px;padding:18px;margin:16px 0}
legend{font-weight:750;padding:0 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
label{display:grid;gap:5px;font-size:14px;font-weight:650}
label.choice{display:flex;align-items:center;font-weight:400}
input,textarea,select,button{font:inherit;border-radius:8px;border:1px solid #bed8e7;padding:9px;min-width:0}
input,textarea,select{width:100%;background:#f8fcff;color:inherit}
input[type=checkbox]{width:auto}
button{cursor:pointer;color:white;background:#0879a4;border-color:#0879a4;font-weight:700}
button:disabled{opacity:.55;cursor:default}
a{color:#075477}
table{width:100%;border-collapse:collapse}
th,td{padding:11px;text-align:left;border-bottom:1px solid #dae9f1;vertical-align:top}
th{background:#eef6fa}
.scroll{overflow:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap}
#notice{color:#8c2a25}
small{font-weight:400}
.field-invalid input:not([type=checkbox]),.field-invalid select,.field-invalid textarea{border-color:#d93025!important;background:#fff7f6!important;box-shadow:0 0 0 1px #d93025}
.field-invalid .choice input[type=checkbox]{outline:2px solid #d93025;outline-offset:2px}
.field-invalid>span:first-child,.field-invalid>strong{color:#b3261e}
[hidden]{display:none!important}
</style>
</head>
<body><header>tipón · TAWAG</header>
<main><h1 id="heading">Online recruitment</h1><p id="notice" role="status">Loading…</p><div id="screen"></div></main>
<script>
const init=<?!= initial ?>;
const root=document.getElementById('screen'), notice=document.getElementById('notice');
let token=init.token, selected='', fields=[], running=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(action,data={})=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).onlineQueue(action,{token,id:selected,site:init.site,...data}));
const transaction=value=>value==='NH'?'New Hire':'Rehire';
const form=(action,contents,label)=>'<form data-action="'+action+'"'+(action==='submit'?' novalidate':'')+'>'+contents+'<p><button type="submit">'+label+'</button></p></form>';
const field=(name,label,type='text',attrs='')=>'<label>'+label+'<input name="'+name+'" type="'+type+'" '+attrs+'></label>';
const docs='<label>Upload Pre-Requirements Documents (PDF or JPEG) *<input name="docs" type="file" accept=".pdf,.jpg,.jpeg,application/pdf,image/jpeg" multiple required><small>Up to 5 MB per file and 10 MB per upload.</small></label>';
const filesToData=async files=>{
  if(files.length>5||files.some(f=>f.size>5*1024*1024)||files.reduce((n,f)=>n+f.size,0)>10*1024*1024)throw Error('Choose up to five files, no more than 5 MB each and 10 MB total.');
  return Promise.all(files.map(file=>new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({name:file.name,data:reader.result.split(',')[1]});
    reader.onerror=()=>reject(Error('File could not be read.'));
    reader.readAsDataURL(file);
  })));
};
function question(q){
  const title=esc(q.title)+(q.required?' *':''), name='q'+q.id, required=q.required?' required':'';
  const help=q.help?'<small>'+esc(q.help)+'</small>':'';
  if(q.type==='CHECKBOX')return '<div class="question" data-id="'+q.id+'"><strong>'+title+'</strong>'+help+q.choices.map(c=>'<label class="choice"><input type="checkbox" name="'+name+'" value="'+esc(c)+'">'+esc(c)+'</label>').join('')+(q.other?field(name,'Other'):'')+'</div>';
  let control;
  if(q.choices.length)control='<select name="'+name+'"'+required+'><option value="">Select an option</option>'+q.choices.map(c=>'<option>'+esc(c)+'</option>').join('')+(q.other?'<option value="__other">Other</option>':'')+'</select>'+(q.other?'<input name="'+name+'Other" placeholder="Specify other" hidden>':'');
  else if(q.title==='Email / Gmail Address')control='<input name="'+name+'" type="email" maxlength="254"'+required+'>';
  else if(q.type==='PARAGRAPH_TEXT')control='<textarea name="'+name+'" maxlength="1500"'+required+'></textarea>';
  else control='<input name="'+name+'" type="'+({DATE:'date',DATETIME:'datetime-local',TIME:'time'}[q.type]||'text')+'" maxlength="1500"'+required+'>';
  return '<label class="question" data-id="'+q.id+'">'+title+help+control+'</label>';
}
function validateApplication(form){
  form.querySelectorAll('.field-invalid').forEach(node=>node.classList.remove('field-invalid'));
  form.querySelectorAll('[aria-invalid="true"]').forEach(node=>node.removeAttribute('aria-invalid'));
  const invalid=[];
  for(const control of Array.from(form.querySelectorAll('input,select,textarea')).filter(node=>!node.disabled)){
    if(!control.validity.valid){
      const wrapper=control.closest('.question')||control.closest('label')||control.parentElement;
      wrapper?.classList.add('field-invalid');
      control.setAttribute('aria-invalid','true');
      invalid.push({wrapper,control});
    }
  }
  for(const question of fields.filter(item=>item.required&&item.type==='CHECKBOX')){
    const wrapper=form.querySelector('[data-id="'+question.id+'"]');
    if(wrapper&&!wrapper.querySelector('input[type="checkbox"]:checked')){
      wrapper.classList.add('field-invalid');
      const control=wrapper.querySelector('input[type="checkbox"]');
      control?.setAttribute('aria-invalid','true');
      invalid.push({wrapper,control});
    }
  }
  if(invalid.length){
    notice.textContent='Please complete all required fields highlighted in red.';
    invalid[0].wrapper?.scrollIntoView({behavior:'smooth',block:'center'});
    invalid[0].control?.focus({preventScroll:true});
    return false;
  }
  notice.textContent='';
  return true;
}
function clearValidation(control){
  if(!control)return;
  const wrapper=control.closest('.question')||control.closest('label');
  if(!wrapper)return;
  const group=wrapper.dataset.id?fields.find(item=>item.id===wrapper.dataset.id):null;
  const valid=group?.type==='CHECKBOX'
    ?wrapper.querySelectorAll('input[type="checkbox"]:checked').length>0
    :Array.from(wrapper.querySelectorAll('input,select,textarea')).filter(item=>!item.disabled).every(item=>item.validity.valid);
  if(valid){
    wrapper.classList.remove('field-invalid');
    wrapper.querySelectorAll('[aria-invalid="true"]').forEach(item=>item.removeAttribute('aria-invalid'));
  }
  if(!root.querySelector('.field-invalid'))notice.textContent='';
}
async function intake(){
  fields=await api('fields');
  let groups=[{title:'Applicant information',items:[]}];
  for(const q of fields) {
    if(!q.id)groups.push({title:q.title,items:[]});
    else groups.at(-1).items.push(q);
  }
  const blocks=groups.filter(g=>g.items.length).map(g=>'<fieldset><legend>'+esc(g.title)+'</legend><div class="grid">'+g.items.map(question).join('')+'</div></fieldset>').join('');
  root.innerHTML=form('submit','<fieldset><legend>Recruitment Transaction *</legend><label><span>Select your transaction</span><select name="transaction" required><option value="">Select recruitment transaction</option><option value="NH">New Hire</option><option value="RH">Rehire</option></select></label></fieldset>'+blocks+'<fieldset><legend>Pre-Requirements</legend>'+docs+'</fieldset>','Submit');
}
const download=(file)=>'<button type="button" data-file="'+esc(file.id)+'">'+esc(file.name)+'</button>';
async function staff(){
  const [list,onsite]=await Promise.all([api('list'),api('onsiteLink')]);
  root.innerHTML='<section><div class="actions"><button type="button" data-refresh>Refresh</button><a href="'+esc(onsite)+'">Office check-in link for onsite QR</a></div><div class="scroll"><table><thead><tr><th>Date</th><th>Queue</th><th>Name</th><th>Transaction</th><th>Action</th><th>Uploaded files</th></tr></thead><tbody>'+list.map(row=>'<tr><td>'+esc(row.date?new Date(row.date).toLocaleDateString('en-PH',{timeZone:'Asia/Manila'}):'')+'</td><td>'+esc(row.number||'—')+'<br><small>'+esc(row.stage==='Arrived'?'Arrived at office':row.stage)+(row.appointment?'<br>'+esc(row.appointment.replace('T',' ')+' PHT'):'')+'</small></td><td>'+esc(row.name)+'</td><td>'+transaction(row.transaction)+'</td><td><div class="actions"><button type="button" data-complete="'+esc(row.id)+'" '+(row.stage==='Review'?'':'disabled')+'>Complete</button><button type="button" data-view="'+esc(row.id)+'">View Details</button></div></td><td><div class="actions">'+row.files.map(file=>'<button type="button" data-file="'+esc(file.id)+'" data-case="'+esc(row.id)+'">'+esc(file.name)+'</button>').join('')+'</div></td></tr>').join('')+(list.length?'':'<tr><td colspan="6">No online applications yet.</td></tr>')+'</tbody></table></div></section>';
}
async function conversation(recruiter){
  const state=await api(recruiter?'readStaff':'read');
  const controls=recruiter?'<button type="button" data-back>Back to Online Queue</button>':
    '<p>Save <a href="'+esc(state.url+'?online=applicant&case='+token)+'">your private application link</a> to check your application status.</p>';
  let process='';
  if(!recruiter && state.stage==='Ready to book')process=form('book',field('appointment','Choose your arrival date and time (PHT) *','datetime-local','required'),'Get Queue');
  if(!recruiter && state.stage==='Review')process=form('upload',docs,'Upload additional documents');
  if(!recruiter && state.stage==='Booked')process+=arrivalControls(state.appointment);
  if(!recruiter && state.stage==='Arrived')process+='<p role="status"><strong>Checked in at the office.</strong> Your queue number has been added to the Online Queue. Please wait for the recruiter to call you.</p>';
  const profile=recruiter?'<details><summary>Applicant information</summary><dl>'+Object.entries(state.answers||{}).map(([label,value])=>'<dt><b>'+esc(label)+'</b></dt><dd>'+esc(Array.isArray(value)?value.join(', '):value)+'</dd>').join('')+'</dl></details>':'';
  const notices=Array.isArray(state.messages)?state.messages:[];
  const noticeBlock=!recruiter&&notices.length?'<section><h3>Recruiter Messages</h3><ul>'+notices.map(message=>'<li><strong>Recruiter</strong><p>'+esc(message.text)+'</p><small>'+esc(message.at)+'</small></li>').join('')+'</ul><small>These are one-way updates. Replies are not available here.</small></section>':'';
  root.innerHTML='<section>'+controls+'<h2>'+esc(state.name)+'</h2><p>'+esc(state.stage)+(state.number?' · <strong>'+esc(state.number)+'</strong>':'')+(state.appointment?' · '+esc(state.appointment.replace('T',' ')+' PHT'):'')+'</p>'+profile+noticeBlock+'<p>Uploaded files</p><ul>'+state.files.map(f=>'<li>'+(recruiter?download(f):esc(f.name))+'</li>').join('')+'</ul>'+process+'</section>';
}
function arrivalControls(appointment){
  const date=String(appointment||'').slice(0,10);
  const parts=Object.fromEntries(new Intl.DateTimeFormat('en-PH',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(part=>[part.type,part.value]));
  const today=[parts.year,parts.month,parts.day].join('-');
  return '<p>When you arrive at the office on your appointment date, confirm your arrival below.</p><form data-action="confirmArrival"><p><button'+(date===today?'':' disabled')+'>Nandito na ako sa office</button></p></form>';
}
async function render(){
  if(init.view==='staff')return selected?conversation(true):staff();
  if(init.view==='onsite'){
    root.innerHTML=form('arrive',field('link','Paste your private application link','url','required'),'Confirm onsite arrival');
    return;
  }
  if(token)return conversation(false);
  return intake();
}
async function run(task){
  if(running)return;
  running=true;root.inert=true;notice.textContent='Working…';
  try{await task();notice.textContent='';}catch(e){notice.textContent=e.message||String(e);}
  finally{running=false;root.inert=false;}
}
root.addEventListener('input',e=>clearValidation(e.target));
root.addEventListener('change',e=>{
  const node=e.target;
  clearValidation(node);
  if(!node.name?.startsWith('q'))return;
  const other=node.form.elements[node.name+'Other'];
  if(other){other.hidden=node.value!=='__other';other.required=!other.hidden;}
  const same=fields.find(q=>q.title.startsWith('Is your permanent address'));
  if(same && node.name==='q'+same.id){
    const skip=/^yes\b/i.test(node.value);
    for(const field of fields.filter(q=>q.title.startsWith('Permanent '))){
      const wrapper=root.querySelector('[data-id="'+field.id+'"]');
      wrapper.hidden=skip;
      for(const control of wrapper.querySelectorAll('input,select,textarea')){
        control.disabled=skip; control.required=!skip&&field.required;
      }
    }
  }
});
root.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.dataset.action==='submit'&&!validateApplication(e.target))return;
  run(async()=>{
    const data=new FormData(e.target), action=e.target.dataset.action;
    if(action==='submit'){
      const requestToken=sessionStorage.getItem('tiponOnlineDraft')||Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');
      sessionStorage.setItem('tiponOnlineDraft',requestToken);
      const answers=Object.fromEntries(fields.filter(q=>q.id).map(q=>{
        const key='q'+q.id, value=data.get(key);
        return [q.id,q.type==='CHECKBOX'?data.getAll(key):value==='__other'?data.get(key+'Other'):value];
      }));
      await api('submit',{token:requestToken,transaction:data.get('transaction'),answers,files:await filesToData(data.getAll('docs'))});
      token=requestToken;
      sessionStorage.removeItem('tiponOnlineDraft');
    }else if(action==='upload')await api('upload',{files:await filesToData(data.getAll('docs'))});
    else if(action==='arrive'){
      token=new URL(data.get('link')).searchParams.get('case')||'';
      const result=await api('arrive');root.innerHTML='<section><h2>Checked in</h2><p>Your queue number is <strong>'+esc(result.number)+'</strong>.</p></section>';return;
    }else await api(action,Object.fromEntries(data));
    await render();
  });
});
root.addEventListener('click',e=>{
  const button=e.target.closest('button');
  if(!button||button.type!=='button')return;
  const d=button.dataset;
  run(async()=>{
    if(d.file){
      const output=await api('download',{id:d.case||selected,file:d.file});
      const blob=new Blob([Uint8Array.from(atob(output.data),x=>x.charCodeAt(0))],{type:output.mime});
      const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=output.name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);return;
    }
    if(d.complete)await api('complete',{id:d.complete});
    if(d.view)selected=d.view;
    if('back' in d)selected='';
    await render();
  });
});
if(init.view==='staff'){document.querySelector('main').classList.add('staff');document.getElementById('heading').textContent='Online Queue';}
if(init.view==='onsite')document.getElementById('heading').textContent='Office check-in';
run(render);
</script>
</body>
</html>
