<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>TIPON TAWAG · Online Queue</title>
<style>
:root{font:16px/1.55 system-ui,sans-serif;color:#093952;background:#eef6fa}
*{box-sizing:border-box}
body{margin:0}
header{background:white;border-top:6px solid #f6b642;text-align:center;padding:22px;font-size:24px;font-weight:800}
main{max-width:760px;margin:42px auto;padding:24px}
section{background:white;border:1px solid #cfe2ed;border-radius:15px;padding:24px}
h1{font-size:clamp(26px,5vw,38px);margin:0 0 12px}
a{display:inline-block;margin-top:12px;padding:10px 16px;border-radius:8px;background:#0879a4;color:white;font-weight:700;text-decoration:none}
#status{color:#456477}
</style>
</head>
<body>
<header>tipón · TAWAG</header>
<main><section>
<h1>Online Queue</h1>
<p id="status">Opening the secure TIPON Workspace Online Queue…</p>
<a id="openQueue" href="#">Open Online Queue</a>
</section></main>
<script src="config.js?v=online-3"></script>
<script>
(()=>{
  const target=new URL(window.TIPON_CONFIG.onlineStaffBackendUrl);
  target.searchParams.set('online','staff');
  document.getElementById('openQueue').href=target.href;
  window.location.replace(target.href);
})();
</script>
</body>
</html>
