<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>TIPON TAWAG · Online Queue</title>
<style>
:root{font:16px/1.55 system-ui,sans-serif;color:#093952;background:#eef6fa}
*{box-sizing:border-box}
body{margin:0}
header{background:white;border-top:6px solid #f6b642;text-align:center;padding:22px;font-size:24px;font-weight:800}
main{max-width:870px;margin:auto;padding:24px}
main.staff{max-width:1400px}
h1{font-size:clamp(26px,5vw,42px);margin:.2em 0 .6em}
section,fieldset{background:white;border:1px solid #cfe2ed;border-radius:15px;padding:18px;margin:16px 0}
legend{font-weight:750;padding:0 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
label{display:grid;gap:5px;font-size:14px;font-weight:650}
label.choice{display:flex;align-items:center;font-weight:400}
input,textarea,select,button{font:inherit;border-radius:8px;border:1px solid #bed8e7;padding:9px;min-width:0}
input,textarea,select{width:100%;background:#f8fcff;color:inherit}
input[type=checkbox]{width:auto}
button{cursor:pointer;color:white;background:#0879a4;border-color:#0879a4;font-weight:700}
button:disabled{opacity:.55;cursor:default}
a{color:#075477}
table{width:100%;border-collapse:collapse}
th,td{padding:11px;text-align:left;border-bottom:1px solid #dae9f1;vertical-align:top}
th{background:#eef6fa}
.scroll{overflow:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.message{overflow-wrap:anywhere;white-space:pre-wrap;background:#eef6fa;padding:10px;border-radius:7px}
#notice{color:#8c2a25}
small{font-weight:400}
[hidden]{display:none!important}
</style>
</head>
<body><header>tipón · TAWAG</header>
<main class="staff"><h1>Online Queue</h1><p><a href="./?view=staff">Back to Staff Console</a></p><p id="signIn" hidden><a id="directLogin" target="_blank" rel="noopener">Open the TIPON Workspace sign-in</a> and reload this page.</p><p id="notice" role="status">Loading…</p><div id="screen"></div></main>
<script src="config.js?v=online-2"></script><script src="public-online-bridge.js?v=3" data-mode="staff"></script><script>
const root=document.getElementById('screen'),notice=document.getElementById('notice');
let selected='',running=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(action,data={})=>onlineRequest(action,{id:selected,...data});
const transaction=value=>value==='NH'?'New Hire':'Rehire';
const form=(action,contents,label)=>'<form data-action="'+action+'">'+contents+'<p><button>'+label+'</button></p></form>';
const download=(file)=>'<button type="button" data-file="'+esc(file.id)+'">'+esc(file.name)+'</button>';
async function staff(){
  const [list,onsite]=await Promise.all([api('list'),api('onsiteLink')]);
  root.innerHTML='<section><div class="actions"><button type="button" data-refresh>Refresh</button><a href="'+esc(onsite)+'">Office check-in link for onsite QR</a></div><div class="scroll"><table><thead><tr><th>Date</th><th>Queue</th><th>Name</th><th>Transaction</th><th>Action</th><th>Uploaded files</th></tr></thead><tbody>'+list.map(row=>'<tr><td>'+esc(row.date?new Date(row.date).toLocaleDateString('en-PH',{timeZone:'Asia/Manila'}):'')+'</td><td>'+esc(row.number||'—')+'<br><small>'+esc(row.appointment?row.appointment.replace('T',' ')+' PHT':row.stage)+'</small></td><td>'+esc(row.name)+'</td><td>'+transaction(row.transaction)+'</td><td><div class="actions"><button type="button" data-complete="'+esc(row.id)+'" '+(row.stage==='Review'?'':'disabled')+'>Complete</button><button type="button" data-chat="'+esc(row.id)+'">Message</button></div></td><td><div class="actions">'+row.files.map(file=>'<button type="button" data-file="'+esc(file.id)+'" data-case="'+esc(row.id)+'">'+esc(file.name)+'</button>').join('')+'</div></td></tr>').join('')+(list.length?'':'<tr><td colspan="6">No online applications yet.</td></tr>')+'</tbody></table></div></section>';
}
async function conversation(){
  const state=await api('readStaff');
  const refresh='<button type="button" data-refresh>Refresh messages</button>';
  const controls='<button type="button" data-back>Back to Online Queue</button>';
  const profile='<details><summary>Applicant information</summary><dl>'+Object.entries(state.answers).map(([label,value])=>'<dt><b>'+esc(label)+'</b></dt><dd>'+esc(value)+'</dd>').join('')+'</dl></details>';
  root.innerHTML='<section>'+controls+'<h2>'+esc(state.name)+'</h2><p>'+esc(state.stage)+(state.number?' · <strong>'+esc(state.number)+'</strong>':'')+(state.appointment?' · '+esc(state.appointment.replace('T',' ')+' PHT'):'')+'</p>'+profile+'<p>Uploaded files</p><ul>'+state.files.map(f=>'<li>'+download(f)+'</li>').join('')+'</ul>'+'</section><section><h2>Conversation</h2>'+refresh+state.messages.map(m=>'<p class="message"><strong>'+esc(m.author)+'</strong><br>'+esc(m.text)+'</p>').join('')+form('staffChat','<label>Your message<textarea name="message" maxlength="2000" required></textarea></label>','Send message')+'</section>';
}

const render=()=>selected?conversation():staff();
async function run(task){
  if(running)return;
  running=true;root.inert=true;notice.textContent='Loading Online Queue…';
  try{await task();notice.textContent='';document.getElementById('signIn').hidden=true;}
  catch(error){
    notice.textContent=error.message||String(error);
    if(!bridgeWindow||/authorized|sign in|timed out/i.test(notice.textContent)){
      const url=new URL(window.TIPON_CONFIG.onlineStaffBackendUrl);
      url.searchParams.set('online','staff');
      document.getElementById('directLogin').href=url.href;
      document.getElementById('signIn').hidden=false;
    }
  }finally{running=false;root.inert=false;}
}
root.addEventListener('submit',event=>{
  event.preventDefault();
  run(async()=>{await api('staffChat',Object.fromEntries(new FormData(event.target)));await render();});
});
root.addEventListener('click',e=>{
  const button=e.target.closest('button');
  if(!button||button.type!=='button')return;
  const d=button.dataset;
  run(async()=>{
    if(d.file){
      const output=await api('download',{id:d.case||selected,file:d.file});
      const blob=new Blob([Uint8Array.from(atob(output.data),x=>x.charCodeAt(0))],{type:output.mime});
      const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=output.name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);return;
    }
    if(d.complete)await api('complete',{id:d.complete});
    if(d.chat)selected=d.chat;
    if('back' in d)selected='';
    await render();
  });
});

run(render);
</script></body></html>
