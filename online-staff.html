<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#075477">
<title>TIPON TAWAG · Online Queue</title>
<link rel="icon" href="assets/tipon-mark.svg">
<style>
:root{font:15px/1.55 system-ui,sans-serif;color:#093952;background:#eef6fa}
*{box-sizing:border-box}
body{margin:0}
header{background:#fff;border-top:6px solid #f6b642;padding:20px 24px;text-align:center;font-size:23px;font-weight:850}
main{max-width:1320px;margin:28px auto;padding:0 22px 40px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(28px,4vw,40px);margin:0}
h2{font-size:21px;margin:0 0 8px}
p{color:#58798b}
.card{background:#fff;border:1px solid #cfe2ed;border-radius:14px;padding:20px;margin:16px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.button{font:inherit;border:1px solid #bed8e7;border-radius:8px;padding:8px 11px;background:#0879a4;color:#fff;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
button.secondary,.button.secondary{background:#fff;color:#075477}
button.success{background:#16885e;border-color:#16885e}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:#075477}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th,td{padding:11px;text-align:left;vertical-align:middle;border-bottom:1px solid #dae9f1}
th{background:#eef6fa;font-size:13px}
td{font-size:14px}
.muted{color:#6c8998}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.row-actions button{padding:5px 8px;font-size:12px}.applicant-cell{min-width:230px}
.file-count{color:#58798b;font-size:12px;margin-left:5px}
dialog{width:min(560px,calc(100% - 28px));max-height:min(78vh,760px);border:1px solid #cfe2ed;border-radius:15px;padding:22px;color:#093952;box-shadow:0 18px 60px #092e4430}
dialog::backdrop{background:#092e4470}
.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dialog-head h2{margin:0}
.dialog-copy{margin:8px 0 16px}
.chat-thread{display:flex;flex-direction:column;gap:10px;max-height:42vh;overflow:auto;padding:12px;background:#f7fbfd;border:1px solid #d6e7ef;border-radius:10px}.chat-bubble{max-width:88%;padding:10px 12px;border-radius:12px;background:#e8f2f7;overflow-wrap:anywhere}.chat-bubble.recruiter{align-self:flex-start}.chat-bubble.applicant{align-self:flex-end;background:#087da5;color:white}.chat-meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:700}.chat-meta time{font-weight:400;opacity:.8}.chat-bubble p{margin:5px 0 0;white-space:pre-wrap}.chat-top{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.chat-top h3{margin:0}.file-list{display:grid;gap:9px;padding:0;list-style:none;margin:14px 0}
.file-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;border:1px solid #dae9f1;border-radius:8px;overflow-wrap:anywhere}
label{display:block;font-weight:700;margin:14px 0 6px}
textarea{display:block;width:100%;min-height:130px;resize:vertical;border:1px solid #bed8e7;border-radius:8px;padding:11px;font:inherit;color:inherit;background:#f8fcff}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
[hidden]{display:none!important}
@media(max-width:600px){main{padding:0 12px 30px}.card{padding:14px}dialog{padding:16px}.page-head{align-items:flex-start}}
button.danger{background:#fff1ef;border-color:#e4b8b4;color:#962f2a}button.danger:hover{background:#ffe2df}</style>
</head>
<body>
<header>tipón · TAWAG</header>
<main>
  <div class="page-head">
    <div><h1>Online Queue</h1><p>Recruitment applications submitted online</p></div>
    <div class="actions"><a class="button secondary" href="./?view=staff">Staff Console</a><button id="refresh" type="button">Refresh</button></div>
  </div>
  <p id="status" role="status" aria-live="polite">Connecting to TIPON Workspace…</p>
  <section class="card">
    <div class="table-wrap"><table>
      <thead><tr><th>Submitted</th><th>Queue Number</th><th>Applicant</th><th>Transaction</th><th>Appointment</th><th>Requirements</th></tr></thead>
      <tbody id="listBody"><tr><td colspan="6" class="muted">Loading applications…</td></tr></tbody>
    </table></div>
  </section>
</main>

<dialog id="requirementsDialog" aria-labelledby="requirementsTitle">
  <div class="dialog-head"><h2 id="requirementsTitle">Uploaded Requirements</h2><button class="secondary" id="closeRequirements" type="button">Close</button></div>
  <p class="dialog-copy" id="requirementsApplicant"></p>
  <ul id="requirementsFiles" class="file-list"></ul>
</dialog>

<dialog id="messageDialog" aria-labelledby="messageTitle">
  <form id="messageForm">
    <div class="dialog-head"><h2 id="messageTitle">Message Applicant</h2><button class="secondary" id="closeMessage" type="button">Close</button></div>
    <p class="dialog-copy" id="messageApplicant"></p>
    <div class="chat-top"><h3>Conversation</h3><button class="secondary" id="refreshMessages" type="button">Refresh messages</button></div>
    <div class="chat-thread" id="messageThread" aria-live="polite"><p class="muted">Loading conversation…</p></div>
    <label for="messageText">Your message</label>
    <textarea id="messageText" maxlength="2000" required placeholder="Write a message…"></textarea>
    <div class="dialog-actions"><button class="secondary" id="cancelMessage" type="button">Close</button><button id="sendMessage" class="success" type="submit">Send Message</button></div>
  </form>
</dialog>

<script src="config.js?v=queue-database-20261126"></script>
<script src="public-online-bridge.js?v=5" data-mode="staff"></script>
<script>
'use strict';
(()=>{
 const $=id=>document.getElementById(id);
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let applications=[],loading=false,activeApplicationId='',activeApplicantName='';
 const api=(action,data={})=>window.onlineRequest(action,data);
 function date(value,time=false){
   if(!value)return '—';
   const d=new Date(value);
   if(!Number.isFinite(d.getTime()))return String(value);
   const options=time?{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Manila'}:{dateStyle:'medium',timeZone:'Asia/Manila'};
   return new Intl.DateTimeFormat('en-PH',options).format(d);
 }
 function appointment(value){
   if(!value)return '—';
   const raw=String(value);
   return date(raw.length===16?raw+':00+08:00':raw,true);
 }
 function setStatus(message){$('status').textContent=message||''}
 function renderList(){
   const body=$('listBody');
   body.innerHTML=applications.length?applications.map(row=>{
     const files=Array.isArray(row.files)?row.files:[];
     const canComplete=row.stage==='Review';
     const completeLabel=canComplete?'Complete': 'Complete';
     return '<tr>'+
       '<td>'+esc(date(row.date,true))+'</td>'+
       '<td><b>'+esc(row.number||'—')+'</b></td>'+
       '<td class="applicant-cell"><b>'+esc(row.name||'—')+'</b><div class="row-actions"><button class="success" type="button" data-complete="'+esc(row.id)+'" '+(canComplete?'':'disabled')+' aria-label="Complete review for '+esc(row.name||'applicant')+'">Complete</button><button class="secondary" type="button" data-message="'+esc(row.id)+'" data-name="'+esc(row.name||'Applicant')+'">Message</button><button class="danger" type="button" data-delete="'+esc(row.id)+'">Delete</button></div></td>'+
       '<td>'+esc(row.transaction==='NH'?'New Hire':row.transaction==='RH'?'Rehire':row.transaction||'—')+'</td>'+
       '<td>'+esc(appointment(row.appointment))+'</td>'+
       '<td><button class="secondary" type="button" data-requirements="'+esc(row.id)+'" '+(files.length?'':'disabled')+'>View</button><span class="file-count">'+files.length+' file(s)</span></td>'+
       
       '</tr>';
   }).join(''):'<tr><td colspan="6" class="muted">No online applications yet.</td></tr>';
 }
 async function loadList(silent=false){
   if(loading)return;
   loading=true;
   if(!silent)setStatus('Refreshing Online Queue…');
   try{
     const result=await api('list');
     if(!Array.isArray(result))throw Error('Invalid Online Queue response.');
     applications=result;
     renderList();
     setStatus('Live • '+applications.length+' application(s) • Synced '+new Date().toLocaleTimeString('en-PH',{timeZone:'Asia/Manila'}));
   }catch(error){
     setStatus('Unable to load Online Queue: '+String(error?.message||error));
   }finally{loading=false}
 }
 async function deleteApplication(id,button){
   if(button){button.disabled=true;button.textContent='Deleting…'}
   try{
     await api('deleteApplication',{id});
     await loadList(true);
     setStatus('Application deleted from the active list and synced to the database.');
   }catch(error){
     if(button){button.disabled=false;button.textContent='Delete'}
     setStatus('Unable to delete application: '+String(error?.message||error));
   }
 }
 async function complete(id,button){
   if(button){button.disabled=true;button.textContent='Completing…'}
   try{
     const result=await api('complete',{id});
     if(result&&result.ok===false)throw Error(result.error||'Application could not be completed.');
     const row=applications.find(item=>item.id===id);
     if(row)row.stage='Ready to book';
     renderList();
     setStatus('Application review completed. Applicant may now book an appointment.');
   }catch(error){
     if(button){button.disabled=false;button.textContent='Complete'}
     setStatus('Unable to complete application: '+String(error?.message||error));
   }
 }
 function openRequirements(id){
   const row=applications.find(item=>item.id===id);
   if(!row)return;
   activeApplicationId=id;
   activeApplicantName=row.name||'Applicant';
   $('requirementsApplicant').textContent=activeApplicantName+' • Uploaded requirements';
   const files=Array.isArray(row.files)?row.files:[];
   $('requirementsFiles').innerHTML=files.length?files.map(file=>'<li><span>'+esc(file.name)+'</span><button class="secondary" type="button" data-download="'+esc(file.id)+'">Download</button></li>').join(''):'<li class="muted">No uploaded requirements.</li>';
   $('requirementsDialog').showModal();
 }
 function renderChat(messages){
   const thread=$('messageThread'),items=Array.isArray(messages)?messages:[];
   thread.innerHTML=items.length?items.map(message=>{
     const applicant=message.author==='Applicant';
     return '<div class="chat-bubble '+(applicant?'applicant':'recruiter')+'"><div class="chat-meta"><span>'+esc(applicant?'Applicant':'Recruiter')+'</span><time>'+esc(date(message.at,true))+'</time></div><p>'+esc(message.text)+'</p></div>';
   }).join(''):'<p class="muted">No messages yet. Start the conversation.</p>';
   thread.scrollTop=thread.scrollHeight;
 }
 async function refreshConversation(){
   if(!activeApplicationId)return;
   const state=await api('readStaff',{id:activeApplicationId});
   renderChat(state.messages);
 }
 async function openMessage(id,name){
   activeApplicationId=id;
   activeApplicantName=name||'Applicant';
   $('messageApplicant').textContent='Conversation with '+activeApplicantName;
   $('messageText').value='';
   $('messageThread').innerHTML='<p class="muted">Loading conversation…</p>';
   $('messageDialog').showModal();
   $('messageText').focus();
   try{await refreshConversation()}catch(error){$('messageThread').innerHTML='<p class="muted">Unable to load messages: '+esc(error.message||error)+'</p>'}
 }
 $('refresh').addEventListener('click',()=>void loadList(false));
 $('listBody').addEventListener('click',event=>{
   const completeButton=event.target.closest('[data-complete]');
   const requirementsButton=event.target.closest('[data-requirements]');
   const messageButton=event.target.closest('[data-message]');
   const deleteButton=event.target.closest('[data-delete]');
   if(completeButton){void complete(completeButton.dataset.complete,completeButton);return}
   if(requirementsButton){openRequirements(requirementsButton.dataset.requirements);return}
   if(messageButton){openMessage(messageButton.dataset.message,messageButton.dataset.name);return}
   if(deleteButton){void deleteApplication(deleteButton.dataset.delete,deleteButton);return}
 });
 $('requirementsFiles').addEventListener('click',async event=>{
   const button=event.target.closest('[data-download]');
   if(!button)return;
   button.disabled=true;button.textContent='Downloading…';
   try{
     const output=await api('download',{id:activeApplicationId,file:button.dataset.download});
     const bytes=Uint8Array.from(atob(output.data),char=>char.charCodeAt(0));
     const blob=new Blob([bytes],{type:output.mime||'application/octet-stream'});
     const url=URL.createObjectURL(blob),link=document.createElement('a');
     link.href=url;link.download=output.name||'requirement';link.click();
     setTimeout(()=>URL.revokeObjectURL(url),1000);
   }catch(error){
     setStatus('Download failed: '+String(error?.message||error));
   }finally{button.disabled=false;button.textContent='Download'}
 });
 $('messageForm').addEventListener('submit',async event=>{
   event.preventDefault();
   const message=$('messageText').value.trim();
   if(!message){$('messageText').focus();return}
   const button=$('sendMessage');button.disabled=true;button.textContent='Sending…';
   try{
     await api('sendMessage',{id:activeApplicationId,message});
     $('messageText').value='';
     await refreshConversation();
     setStatus('Message sent. Conversation synced for '+activeApplicantName+'.');
   }catch(error){
     setStatus('Unable to send message: '+String(error?.message||error));
   }finally{button.disabled=false;button.textContent='Send Message'}
 });
 $('refreshMessages').addEventListener('click',async()=>{
   try{await refreshConversation()}catch(error){setStatus('Unable to refresh conversation: '+String(error?.message||error))}
 });
 $('closeRequirements').onclick=()=>$('requirementsDialog').close();
 $('closeMessage').onclick=()=>$('messageDialog').close();
 $('cancelMessage').onclick=()=>$('messageDialog').close();
 if(selectedCase()){}
 function selectedCase(){return new URLSearchParams(location.search).get('case')||''}
 void loadList(false);
 setInterval(()=>void loadList(true),5000);
 setInterval(()=>{if($('messageDialog').open)void refreshConversation().catch(()=>{})},5000);
})();
</script>
</body>
</html>
